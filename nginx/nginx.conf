events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Rate limiting — API so'rovlari uchun (IP bo'yicha)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # Fayl yuklash limiti (Spring Boot: 10MB, nginx ham shunday)
    client_max_body_size 10M;

    # Gzip siqish
    gzip            on;
    gzip_vary       on;
    gzip_types      application/json text/plain application/javascript text/css;
    gzip_min_length 1024;

    upstream app_backend {
        server app:8080;
        keepalive 32;
    }

    # ── HTTP: faqat Let's Encrypt challenge va HTTPS redirect ──────────────────
    server {
        listen 80;
        server_name silverladys.uz www.silverladys.uz;

        # Certbot webroot challenge (sertifikat olish/yangilash uchun)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Qolgan hamma narsa HTTPS ga yo'naltiriladi
        location / {
            return 301 https://silverladys.uz$request_uri;
        }
    }

    # ── HTTPS: www → non-www redirect ─────────────────────────────────────────
    server {
        listen 443 ssl;
        http2  on;
        server_name www.silverladys.uz;

        ssl_certificate     /etc/letsencrypt/live/silverladys.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/silverladys.uz/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        return 301 https://silverladys.uz$request_uri;
    }

    # ── HTTPS ──────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2  on;
        server_name silverladys.uz;

        ssl_certificate     /etc/letsencrypt/live/silverladys.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/silverladys.uz/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Xavfsizlik headerlari
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff"                             always;
        add_header X-Frame-Options           "SAMEORIGIN"                          always;

        # ── Frontend (React) ─────────────────────────────────────────────────
        root /var/www/frontend;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── API ──────────────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass                http://app_backend;
            proxy_http_version        1.1;
            proxy_set_header          Host              $host;
            proxy_set_header          X-Real-IP         $remote_addr;
            proxy_set_header          X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header          X-Forwarded-Proto $scheme;
            proxy_set_header          Connection        "";

            client_body_buffer_size   10m;
            proxy_request_buffering   on;
            proxy_connect_timeout     10s;
            proxy_send_timeout        60s;
            proxy_read_timeout        60s;
        }

        # ── Rasm/fayl yuklash (Nginx to'g'ridan-to'g'ri disk dan serve qiladi) ─
        location /uploads/ {
            alias   /var/www/uploads/;
            expires 1d;
            add_header Cache-Control "public, max-age=86400";
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # ── Telegram Mini App ────────────────────────────────────────────────
        location /mini/ {
            alias /var/www/miniapp/;
            try_files $uri $uri/ /mini/index.html;
        }

        # ── Health check (monitoring uchun) ──────────────────────────────────
        location /actuator/health {
            proxy_pass http://app_backend;
            access_log off;
        }

    }
}
